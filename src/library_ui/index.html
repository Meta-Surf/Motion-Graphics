<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca Motion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e9f1f7;font:16px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{margin:0 0 8px}p{color:#acbac7}form,.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;padding:12px;border:1px solid #607385;border-radius:6px;background:#202e3a;color:inherit}button{cursor:pointer}button.primary{background:#99ecd4;color:#122b29}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{text-align:left;padding:8px}.card img{width:100%;height:160px;object-fit:contain;background:#080e14}.card strong{display:block;padding:8px 0;overflow-wrap:anywhere}.badge{font-size:12px;color:#b5c5d3}dialog{background:#182531;color:inherit;border:1px solid #789;border-radius:12px;width:min(1100px,95vw);max-height:90vh}dialog::backdrop{background:#000b}.alpha-grid{display:flex;gap:12px;overflow:auto}.alpha-grid img{width:30%;min-width:200px;height:260px;object-fit:contain}.light{background:#fff}.dark{background:#03070d}.checker{background:repeating-conic-gradient(#ddd 0% 25%,#777 0% 50%) 50%/24px 24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font-size:12px}#status{min-height:24px}label{display:flex;gap:8px;align-items:center}
</style><main><h1>Biblioteca Motion</h1><p>Pesquise antes de gerar. Selecione um recurso para inspecionar e aplicar à cena.</p>
<form id="search"><input name="q" aria-label="Pesquisa" placeholder="Descrição ou tags"><select name="category" aria-label="Categoria"><option value="">Todas as categorias</option><option>image</option><option>clip</option><option>audio</option><option>cutout</option><option>mask</option><option>background</option><option>texture</option><option>overlay</option><option>component</option></select><select name="approval" aria-label="Aprovação"><option value="">Qualquer revisão</option><option value="approved">Aprovados</option><option value="pending">Pendentes</option><option value="rejected">Rejeitados</option></select><button class="primary">Pesquisar</button></form>
<p id="status" role="status"></p><div id="grid" class="grid"></div>
<dialog id="detail"><button id="close">Fechar</button><h2 id="title"></h2><div id="visual" class="alpha-grid"></div><p id="facts"></p><pre id="metadata"></pre><form id="apply"><input name="project" required placeholder="projeto" aria-label="Projeto" pattern="[a-z0-9][a-z0-9_-]{0,63}"><input name="scene" required placeholder="cena" aria-label="Cena" pattern="[a-z0-9][a-z0-9_-]{0,63}"><input name="layer" required placeholder="camada" aria-label="Camada" pattern="[a-z0-9][a-z0-9_-]{0,63}"><label><input type="checkbox" name="preview">Prévia de recurso pendente</label><button class="primary">Aplicar à cena</button></form><p id="applied" role="status"></p></dialog></main>
<script nonce="__TOKEN__">
const $=s=>document.querySelector(s);let selected;const token='__TOKEN__';
async function load(){try{const query=new URLSearchParams(new FormData($('#search')));const r=await fetch('/api/assets?'+query);const data=await r.json();if(!r.ok)throw Error(data.error);$('#grid').replaceChildren();$('#status').textContent=data.length+' recursos (até 100 por busca)';for(const a of data){const card=document.createElement('button');card.className='card';if(a.thumbnail){const im=document.createElement('img');im.src='/media/'+a.id+'/thumbnail';im.alt='';card.append(im)}const name=document.createElement('strong');name.textContent=a.description;const badge=document.createElement('span');badge.className='badge';badge.textContent=a.category+' · '+a.approval;card.append(name,badge);card.onclick=()=>open(a);$('#grid').append(card)}}catch(e){$('#status').textContent=e.message}}
function open(a){selected=a;$('#title').textContent=a.description;$('#visual').replaceChildren();if(a.metadata.width&&a.category!=='clip'){for(const bg of ['light','dark','checker']){const im=document.createElement('img');im.className=bg;im.src='/media/'+a.id+'/original';im.alt='Inspeção de bordas: '+bg;$('#visual').append(im)}}$('#facts').textContent='Alpha: '+a.metadata.alpha+' · Licença: '+a.license+' · Revisão: '+a.approval;$('#metadata').textContent=JSON.stringify(a,null,2);$('#applied').textContent='';$('#detail').showModal()}
$('#close').onclick=()=>$('#detail').close();$('#search').onsubmit=e=>{e.preventDefault();load()};$('#apply').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const body={asset_id:selected.id,project:f.get('project'),scene:f.get('scene'),layer:f.get('layer'),preview:f.has('preview')};try{const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json','X-Motion-Token':token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);$('#applied').textContent='Seleção salva. O compilador usa o ID na cena e registra a utilização.'}catch(err){$('#applied').textContent=err.message}};load();
</script></html>
