name: Process Cloudflare image queue

on:
  push:
    paths:
      - "jobs/pending/**"
      - ".github/workflows/cloudflare-image-queue.yml"
      - "src/process_image_queue.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: cloudflare-image-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process queued images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python src/process_image_queue.py

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-generated-images-${{ github.run_id }}
          path: output/generated/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Write result manifests
        env:
          IMAGE_RUN_ID: ${{ github.run_id }}
          IMAGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("jobs/processed")
          generated = Path("output/generated")
          artifact = f"cloudflare-generated-images-{os.environ['IMAGE_RUN_ID']}"
          for manifest in sorted(root.glob("*.json")):
              if manifest.name.endswith(".result.json"):
                  continue
              result_path = root / f"{manifest.stem}.result.json"
              if result_path.exists():
                  continue
              job = json.loads(manifest.read_text(encoding="utf-8"))
              job_id = job["job_id"]
              files = sorted(str(p) for p in (generated / job_id).glob("*") if p.is_file())
              result = {
                  "job_id": job_id,
                  "run_id": int(os.environ["IMAGE_RUN_ID"]),
                  "run_url": os.environ["IMAGE_RUN_URL"],
                  "artifact_name": artifact,
                  "artifact_retention_days": 7,
                  "images": files,
              }
              result_path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Mark jobs complete
        run: |
          if git diff --quiet -- jobs/pending jobs/processed; then
            echo "Nenhum job novo para marcar como concluído."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/pending jobs/processed
          git commit -m "Mark Cloudflare image jobs complete"
          # Keep queue status updates when another commit reaches main during image generation.
          git fetch origin main
          git rebase origin/main
          git push
