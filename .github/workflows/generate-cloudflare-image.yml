name: Generate image with Cloudflare Workers AI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt visual da imagem"
        required: true
        type: string
      width:
        description: "Largura (256–1920)"
        required: true
        default: "1024"
        type: string
      height:
        description: "Altura (256–1920)"
        required: true
        default: "1792"
        type: string
      filename:
        description: "Nome do PNG (sem diretórios)"
        required: true
        default: "cloudflare-test.png"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          IMAGE_WIDTH: ${{ inputs.width }}
          IMAGE_HEIGHT: ${{ inputs.height }}
          IMAGE_FILENAME: ${{ inputs.filename }}
        run: |
          python - <<'PY'
          import os
          import re
          width, height = int(os.environ["IMAGE_WIDTH"]), int(os.environ["IMAGE_HEIGHT"])
          filename = os.environ["IMAGE_FILENAME"]
          if not (256 <= width <= 1920 and 256 <= height <= 1920):
              raise SystemExit("Width/height must be from 256 to 1920.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*\.png", filename, re.IGNORECASE):
              raise SystemExit("Filename must be a simple PNG filename, without directories.")
          PY

      - name: Generate PNG
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
          IMAGE_WIDTH: ${{ inputs.width }}
          IMAGE_HEIGHT: ${{ inputs.height }}
          IMAGE_FILENAME: ${{ inputs.filename }}
        run: |
          python src/providers/cloudflare_workers_ai.py \
            --prompt "$IMAGE_PROMPT" \
            --width "$IMAGE_WIDTH" \
            --height "$IMAGE_HEIGHT" \
            --output "output/generated/$IMAGE_FILENAME"

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-generated-image
          path: output/generated/*
          if-no-files-found: error
          retention-days: 7
