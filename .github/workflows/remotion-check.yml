name: Remotion typecheck

on:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "remotion/**"
      - ".github/workflows/remotion-check.yml"
      - "src/process_image_queue.py"
      - "src/providers/cloudflare_workers_ai.py"
      - "src/providers/gemini_orchestrator.py"
      - "src/image_queue.py"
      - "motion-library/catalog.json"
      - "motion-library/orchestration-templates.json"
      - "examples/cloudflare-layered-image-job.example.json"
      - "scripts/**"
      - "src/providers/voicestudio.py"
      - "src/build_composition.py"
      - "src/video_contract.py"
      - "schemas/**"
      - "examples/video-director.*.json"
      - "examples/gemini-manifest.example.json"
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "remotion/**"
      - ".github/workflows/remotion-check.yml"
      - "scripts/**"
      - "src/providers/**"
      - "src/image_queue.py"
      - "motion-library/catalog.json"
      - "motion-library/orchestration-templates.json"
      - "src/build_composition.py"
      - "src/video_contract.py"
      - "schemas/**"
      - "examples/video-director.*.json"
      - "examples/gemini-manifest.example.json"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  pipeline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile src/process_image_queue.py src/providers/cloudflare_workers_ai.py
      - run: python -m json.tool examples/cloudflare-layered-image-job.example.json > /dev/null

      - run: python scripts/test_pipeline.py
      - run: python -m pip install -r scripts/requirements-pipeline.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python scripts/test_asset_library.py
      - run: python scripts/test_library_project.py
      - run: python scripts/test_orchestration.py
      - run: python src/build_composition.py examples/video-director.short.json --validate-only
      - run: python -m pip install -r scripts/requirements-gemini.txt
      - run: python scripts/test_gemini_orchestrator.py
