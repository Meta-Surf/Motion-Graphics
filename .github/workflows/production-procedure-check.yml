name: Production procedure contracts
on:
  push:
    paths: ['src/**', 'scripts/**', 'schemas/**', 'examples/production-*', 'examples/capabilities.*', '.github/workflows/production-procedure-check.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'schemas/**', 'examples/production-*', 'examples/capabilities.*', '.github/workflows/production-procedure-check.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r scripts/requirements-gemini.txt
      - run: python scripts/test_production_workflow.py
      - run: python scripts/test_orchestration.py
      - run: python scripts/test_gemini_orchestrator.py
      - run: python scripts/production.py plan examples/production-request.synthetic.json --capabilities examples/capabilities.example.json
      - run: python -m compileall -q src scripts
